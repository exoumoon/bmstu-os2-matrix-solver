cargo-features = ["codegen-backend"]

[package]
name = "bmstu-os2-matrix-solver"
version = "0.1.0"
edition = "2021"
authors = ["mxxntype <59417007+mxxntype@users.noreply.github.com>"]
description = "none"

[profile.dev]
codegen-backend = "cranelift"

# NOTE: Generated, no unsafe by default.
#
# If you intend on writing unsafe, remove it from here.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
correctness = "warn"
suspicious = "warn"
style = "warn"
pedantic = "warn"
nursery = "warn"
complexity = "warn"
perf = "warn"
enum_glob_use = { level = "warn", priority = 1 }
single_match_else = { level = "allow", priority = 1 }
match_bool = { level = "allow", priority = 1 }

[dependencies]
color-eyre = "0.6.3"
nalgebra = "0.33.2"
sprs = "0.11.3"
